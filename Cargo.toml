[package]
name = "vrc-ban"
version = "0.7.1"
authors = ["Shayne Hartford <shaybox@shaybox.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
color-eyre = { version = "0.6", default-features = false }
derive-config = { version = "2", features = ["dirs", "toml"] }
poise = { version = "0.6", features = ["collector"], optional = true }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", features = ["mysql"] }
time = { version = "0.3", features = ["serde"], optional = true }
tokio = { version = "1", features = ["macros"] }
totp = { version = "5", package = "totp-rs" }
vrchatapi = { version = "1", default-features = false }

[features]
default = ["discord", "rustls-tls"]
discord = ["dep:poise", "dep:time"]
native-tls = ["reqwest/native-tls", "sqlx/runtime-tokio-native-tls"]
rustls-tls = ["reqwest/rustls", "sqlx/runtime-tokio-rustls"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1

[lints.clippy]
pedantic = "warn"
nursery = "warn"
